  # --- Depth expansion: rate setpoint MAX saturation ---
  # Rate MAX 확장은 actuator/구조 여유에 의존 — single-log 분석으로 안전 검증 불가 → advisory_only.
  - airframe: "MULTICOPTER"
    issue_id: "rate_limit_saturation_roll"
    candidates:
      "rate MAX increase candidate":
        - param: "MC_ROLLRATE_MAX"
          risk_tier: "high"
          advisory_only: true
          range: [0.0, 1800.0]
          rationale: "Roll rate MAX 상향: mission이 요구하는 rate 수용. 인가/구조 여유는 단일 로그로 검증 불가 — 수치 권장 보류."
          verification: "지상 인가/모터 헤드룸 확인 후 +10°/s씩 점진 적용, rate 포화 비율과 actuator saturation 재측정."
      "attitude P decrease candidate":
        - param: "MC_ROLL_P"
          risk_tier: "low"
          severity_delta: { warning: 0.92, problem: 0.88 }
          range: [0.0, 12.0]
          rationale: "Roll attitude P 감소: rate 명령 자체를 줄여 MAX 포화 완화. 안정화 방향."
          verification: "attitude tracking 영향과 rate 포화 비율 동시 관찰."

