        - param: "MC_ROLL_P"
          risk_tier: "low"
          severity_delta: { warning: 0.92, problem: 0.85 }
          range: [0.0, 12.0]
          rationale: "Roll attitude P 감소: attitude overshoot/oscillation 완화. 안정화 방향이므로 저위험."
          verification: "attitude step 응답 overshoot < 15%, rise < 0.8s 재측정."
      "attitude P increase candidate":
        - param: "MC_ROLL_P"
          risk_tier: "medium"
          severity_delta: { warning: 1.08, problem: 1.15 }
          range: [0.0, 12.0]
          rationale: "Roll attitude P 증가: attitude tracking error / rise lag 개선. inner-loop rate 명령이 커지므로 saturation 위험 동반."
          verification: "attitude MAE 감소와 inner-loop rate saturation 비율 동시 확인."

