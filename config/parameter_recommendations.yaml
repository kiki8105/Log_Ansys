          verification: "heading tracking 영향과 rate 포화 비율 동시 관찰."

  # --- Depth expansion: position controller acceleration limits ---
  # 가속 한계 확장은 추력 여유 가정에 의존 — advisory_only.
  - airframe: "MULTICOPTER"
