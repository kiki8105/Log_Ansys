schema_version: "1.0"
profile: "general_controller_tuning"
description: >
  Conservative PX4 parameter-value recommendations derived from Control
  Tuning Advisor issues. Each suggestion is bounded by (1) per-action
  risk_tier, (2) per-step ±10% delta cap, (3) PX4 parameter range clamp,
  (4) ≥70% confidence floor, and (5) confounder-first safety gates.
  Actions whose physical consequence is hard to predict from a single
  log (D-term increases, envelope expansions, FW speed-weight shifts)
  are emitted as `advisory_only` text — no number is produced, the
  pilot must verify on a calmer flight or auto-tune before acting.

safety:
  # Maximum |Δ| per single recommendation step, applied AFTER severity_delta
  # but BEFORE PX4 range clamp. Set conservatively for real-airframe tuning:
  # a single step never moves a parameter by more than this fraction so that
  # the pilot can fly, verify, and decide before the next step.
  max_delta_percent_per_step: 10.0

  # Confidence floor for emitting concrete value suggestions. Below this the
  # diagnoser still shows candidate text and rationale, but no number is
  # produced — the user is expected to investigate before tuning.
  min_confidence_to_recommend: 70.0

  # Staged-apply guidance attached to every concrete suggestion. The pilot
  # should not jump straight to the final number; halve the delta, fly,
  # verify, then close the rest.
  staged_apply:
    enabled: true
    first_step_fraction: 0.5
    note: >
      [단계 적용 권장] 1단계: 권장 Δ의 50%만 반영하고 동일 maneuver를 재비행해
      verification 항목 모두 정상 범위인지 확인 → 2단계: 나머지 50%를 반영하고
      재검증. 단계 사이에 진동/EKF innovation 악화 시 즉시 롤백.

  # VTOL → MULTICOPTER fallback uses MC parameter family for VTOL hover-mode
  # issues. Hover dynamics differ (longer moment arms, larger inertia, FW
  # surface drag), so every fallback recommendation carries an explicit
  # safety note to keep the pilot from treating it as a VTOL-specific value.
  vtol_fallback_note: >
    [VTOL FALLBACK] MULTICOPTER 매핑 기반 추정값입니다. VTOL hover 동역학(긴
    모멘트 암, 큰 관성, FW 표면 항력)이 다르므로 MC 권장값을 그대로 적용하지
    말고 단계적 검증을 권장합니다.

  # If issue.tuning_candidates contains any of these "*-first" guidance
  # texts, gain recommendations are suppressed entirely (confounder
  # must be resolved before tuning).
  block_when_candidates_contain:
    - "actuator authority check first"
    - "hardware vibration mitigation first"
    - "estimator / sensor check first"
    - "filter tuning first"

  # Per-action risk tier multipliers, applied AFTER severity_delta and
  # BEFORE max_delta_percent_per_step cap. Tier shrinks the effective Δ for
  # actions whose physical consequence is harder to predict from a single
  # log (D-term: noise amplification; envelope expansion: thrust/structural
  # margin assumption). `advisory_only` actions emit text guidance only.
  risk_tier_multipliers:
    low: 1.0       # P/I/FF/TC decrease, attitude P decrease — stabilizing direction
    medium: 0.7    # P/I/FF/TC increase — response acceleration
    high: 0.5      # D increase, envelope expansion — kept narrow even if used

# (airframe, issue_id) -> { candidate_text: [parameter_action, ...] }
#
# Per-action keys (in addition to param/severity_delta/range/rationale/...):
#   risk_tier: "low" | "medium" | "high"
#       physical reversibility class — multiplier applied before the global cap.
#   advisory_only: true
#       suppress concrete value emission; recommender returns advisory text
#       in place of a `suggested` number. Used for D-term increases, envelope
#       expansions (*_MAX, TILTMAX, CLMB_MAX, SINK_MIN), FW speed-weight, and
#       VTOL transition envelope — all of which depend on hardware margins
#       the single-log analyzer cannot verify.
mappings:
  - airframe: "MULTICOPTER"
    issue_id: "rate_loop_roll"
    candidates:
      "P decrease candidate":
        - param: "MC_ROLLRATE_P"
          risk_tier: "low"
          severity_delta: { warning: 0.92, problem: 0.85 }
          range: [0.01, 0.5]
          rationale: "Roll rate P 감소: overshoot 완화. 안정화 방향이므로 저위험."
          verification: "동일 step input에서 overshoot < 18%, settling < 1.2s 재측정."
      "P increase candidate":
        - param: "MC_ROLLRATE_P"
          risk_tier: "medium"
          severity_delta: { warning: 1.08, problem: 1.15 }
          range: [0.01, 0.5]
          rationale: "Roll rate P 증가: rise time 단축. 응답 가속은 진동 위험 동반 — 단계 적용."
          verification: "rise time 단축 폭과 dominant_freq / vibration_rms 동시 확인."
      "D increase candidate":
        - param: "MC_ROLLRATE_D"
          risk_tier: "high"
          advisory_only: true
          range: [0.0, 0.01]
          rationale: "Roll rate D 증가: oscillation/overshoot 감쇠 가능하지만 노이즈 증폭으로 모터 발진 위험. 단일 로그만으로 적정값 판단 불가."
          verification: "자이로 RMS 노이즈 측정 + auto-tune D 결과와 교차검증 후에만 적용."
          gate:
            require_metric_below:
              vibration_rms: 3.5
      "I increase candidate":
        - param: "MC_ROLLRATE_I"
          risk_tier: "medium"
          severity_delta: { warning: 1.08, problem: 1.12 }
          range: [0.0, 0.6]
          rationale: "Roll rate I 증가: steady-state error 해소. integrator windup 위험 동반."
          verification: "steady-state tracking error 감소와 windup 지표 동시 확인."
      "FF increase candidate":
        - param: "MC_ROLLRATE_FF"
          risk_tier: "medium"
          severity_delta: { warning: 1.08, problem: 1.12 }
          range: [0.0, 2.0]
          rationale: "Roll rate FF 증가: rise lag 보정. overshoot 없는 lag일 때만 유효."
          verification: "rise time 단축과 overshoot 변화 동시 확인."

