          range: [0.0, 0.6]
          rationale: "Yaw rate P 증가: yaw tracking 보강. 응답 가속은 진동 위험 동반."
          verification: "yaw rise time 개선과 vibration_rms / control_effort_variation 영향 동시 확인."
      "D increase candidate":
