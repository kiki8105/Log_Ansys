          severity_delta: { warning: 0.92, problem: 0.85 }
          range: [0.01, 0.6]
          rationale: "Pitch rate P 감소: overshoot 완화. 안정화 방향이므로 저위험."
          verification: "동일 step input에서 overshoot < 18%, settling < 1.2s 재측정."
      "P increase candidate":
        - param: "MC_PITCHRATE_P"
          risk_tier: "medium"
          severity_delta: { warning: 1.08, problem: 1.15 }
          range: [0.01, 0.6]
          rationale: "Pitch rate P 증가: rise time 단축. 응답 가속은 진동 위험 동반 — 단계 적용."
          verification: "rise time 단축 폭과 dominant_freq / vibration_rms 동시 확인."
      "D increase candidate":
        - param: "MC_PITCHRATE_D"
          risk_tier: "high"
          advisory_only: true
          range: [0.0, 0.01]
          rationale: "Pitch rate D 증가: oscillation/overshoot 감쇠 가능하지만 노이즈 증폭으로 모터 발진 위험. 단일 로그만으로 적정값 판단 불가."
          verification: "자이로 RMS 노이즈 측정 + auto-tune D 결과와 교차검증 후에만 적용."
          gate:
            require_metric_below:
