          range: [0.0, 0.6]
          rationale: "Pitch rate I 증가: steady-state error 해소. integrator windup 위험 동반."
          verification: "steady-state tracking error 감소와 windup 지표 동시 확인."
      "FF increase candidate":
        - param: "MC_PITCHRATE_FF"
          risk_tier: "medium"
          severity_delta: { warning: 1.08, problem: 1.12 }
          range: [0.0, 2.0]
          rationale: "Pitch rate FF 증가: rise lag 보정. overshoot 없는 lag일 때만 유효."
          verification: "rise time 단축과 overshoot 변화 동시 확인."

  - airframe: "MULTICOPTER"
    issue_id: "rate_loop_yaw"
    candidates:
