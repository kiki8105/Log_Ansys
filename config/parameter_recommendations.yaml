          advisory_only: true
          range: [0.0, 0.01]
          rationale: "Yaw rate D 증가: yaw oscillation 감쇠 가능하지만 PX4에서 yaw D는 매우 작음 — 노이즈 증폭 위험이 P/Roll/Pitch D보다 크다. 권장값 자동 산출 보류."
          verification: "yaw 진동 dominant_freq, 자이로 noise floor 측정 후에만 수동 조정."
